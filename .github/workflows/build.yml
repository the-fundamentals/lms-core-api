name: build.yml
run-name: 🏗️ Build for "${{ github.event.head_commit.message || github.sha }}"

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      auto-deploy:
        type: boolean
        description: Automatically deploy to dev server
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 🏢 Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 #v5.3.0
        with:
          cache: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 #v6.2.0

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 #v6.2.0

      - name: Run tests
        run: |
          chmod a+x ./gradlew
          ./gradlew check

      # Short SHA tag; imagePlatform is linux/arm64 so QEMU needed on amd64 runners
      - name: Set image version
        id: meta
        run: echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 #v3.7.0
        with:
          platforms: arm64

      - name: Build & Publish Image
        env:
          GH_REGISTRY_USER: ${{ github.actor }}
          GH_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod a+x ./gradlew
          ./gradlew bootBuildImage --publishImage -Pversion=${{ steps.meta.outputs.version }}

