name: build.yml
run-name: 🏗️ Build for "${{ github.event.head_commit.message || github.sha }}"

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  build:
    name: 🏢 Build
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 #v5.3.0
        with:
          cache: true

      # Gradle setup is purely for caching benefits. Mise already installs gradle, and we call via the ./gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 #v6.2.0

      - name: Validate wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 #v6.2.0

      - name: Run tests
        run: |
          chmod a+x ./gradlew
          ./gradlew check

      - name: Set image version & name
        id: meta
        run: | 
          echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}-arm64" >> "$GITHUB_OUTPUT"

      - name: Build & Publish Image
        env:
          GH_REGISTRY_USER: ${{ github.actor }}
          GH_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          chmod a+x ./gradlew
          ./gradlew bootBuildImage --publishImage --imageName="$IMAGE"

  deploy:
    name: 🚀 Deploy
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
      packages: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_EC2_INSTANCE_ID: ${{ secrets.AWS_EC2_INSTANCE_ID }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Setup AWS
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.2.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}

      - name: Connect & Deploy to EC2
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REG_USER: ${{ github.actor }}
        run: |
          PARAMS=$(jq -n --arg img "$IMAGE" --arg tok "$TOKEN" --arg usr "$REG_USER" '{
            commands: [
              "set -euo pipefail",
              "export HOME=/root",
              "trap \"docker logout ghcr.io\" EXIT",
              "echo \($tok) | docker login ghcr.io -u \($usr) --password-stdin",
              "docker pull \($img)"
            ]
          }')
          
          COMMAND_ID=$(
            aws ssm send-command \
              --instance-ids "$AWS_EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "$PARAMS" \
              --query Command.CommandId --output text
          )
          
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" --instance-id "$AWS_EC2_INSTANCE_ID" || {
              aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" --instance-id "$AWS_EC2_INSTANCE_ID"
              exit 1
            }
          
          # show the output (pull progress, errors) even on success
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" --instance-id "$AWS_EC2_INSTANCE_ID" \
            --query StandardOutputContent --output text
