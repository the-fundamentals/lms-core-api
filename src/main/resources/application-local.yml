# LocalStack / docker-compose overrides. Activate with --spring.profiles.active=local
app:
  cognito:
    # LocalStack Cognito IdP path (differs from real Cognito Hosted UI domain).
    client-full-domain: ${COGNITO_BASE_DOMAIN}/_aws/cognito-idp
  utility:
    storage:
      landing-zone-bucket-name: lms-local-landing-zone
      public-store-bucket-name: lms-local-public
      region: ap-southeast-1
      use-dummy-credentials: true
      cloud-mode: localstack
  config:
    load-dummy-accounts-into-database: true

spring:
  config:
    import: optional:classpath:.env.local[.properties]
