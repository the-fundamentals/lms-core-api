spring:
  application:
    name: lms-core-api
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      schema-locations: classpath:schema.sql
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${app.cognito.base-domain}/${app.cognito.user-pool-id}/.well-known/jwks.json

app:
  cognito:
    user-pool-id: ${COGNITO_USER_POOL_ID:ap-southeast-1_e504a9332e3448879eac389f78fd4844}
    app-client-id: ${COGNITO_APP_CLIENT_ID:rokz3afjqqov2iihppvmnnka3j}
    base-domain: ${COGNITO_BASE_DOMAIN:http://localhost.localstack.cloud:4566}
    client-full-domain: ${COGNITO_CLIENT_FULL_DOMAIN:${app.cognito.base-domain}/_aws/cognito-idp}
  utility:
    storage:
      landing-zone-bucket-name: lms-local-landing-zone
      public-store-bucket-name: lms-local-public
      region: ap-southeast-1
      s3-endpoint: http://localhost.localstack.cloud:4566
      use-dummy-credentials: true
      presigned-expiration-minutes: 5
      cloud-mode: localstack

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    url: /openapi.yml
    disable-swagger-default-url: true
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
    persist-authorization: true
    oauth:
      client-id: ${app.cognito.app-client-id}
      scopes: openid,email,profile
      use-pkce-with-authorization-code-grant: true
      # Swagger redirect (must be allow-listed in Cognito callback URLs):
      #   {api-origin}/swagger-ui/oauth2-redirect.html
