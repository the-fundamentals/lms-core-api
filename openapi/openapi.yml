openapi: 3.0.3
info:
  title: LMS Core API
  version: 0.2.8
  description: Core API for the Learning Management System. Management endpoints under `/admin/**` require the ADMIN role. Authenticated self-service endpoints live under `/private/**`.
  contact:
    name: Sang Dang
    email: contact@fundamentals.io.vn
tags:
  - name: AccountProfile
    description: Authenticated account profile (`/private/profile`) for any logged-in user
  - name: Accounts
    description: Admin-only Account querying capabilities (`/admin/account`)
  - name: Classroom
    description: Admin-only classroom management (`/admin/classrooms`)
  - name: ClassroomMembers
    description: Admin-only classroom member management (`/admin/classrooms/.../members`)
  - name: ClassroomSchedule
    description: Admin-only classroom schedule management (`/admin/classrooms/.../schedule`)
  - name: ClassroomSessions
    description: Admin-only classroom session and attendance management (`/admin/classrooms/.../sessions` and member attendance history)
  - name: Storage
    description: Private endpoints to upload files to the system
  - name: _Test
    description: >
      Test endpoints

security:
  - cognitoOAuth:
      - openid
      - email
      - profile
  - bearerAuth: []
paths:
  /admin/account/query:
    post:
      tags:
        - Accounts
      operationId: getAllAccounts
      summary: Get all accounts
      description: Query all account profiles in the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountFilter"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllAccountsResponse"
  /private/profile:
    get:
      tags:
        - AccountProfile
      operationId: getMyAccountProfile
      summary: Get the current user's account profile
      description: >
        Returns the account profile for the authenticated Cognito user (JWT `sub`). When no profile row exists yet, responds with `ACCOUNT_PROFILE_NOT_FOUND` so the client can onboard.

      responses:
        "200":
          description: Account profile found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfileResponse"
        "401":
          description: Missing or invalid bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No account profile for this Cognito user (onboarding required)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - AccountProfile
      operationId: updateMyAccountProfile
      summary: Update the current user's account profile
      description: >
        Upserts the account profile for the authenticated user (JWT `sub`). Request body updates `firstName` and `lastName` only. Email is taken from the Cognito ID token supplied in `X-ID-Token` (must be `token_use=id` and the same `sub` as the access token). Creates the profile when none exists yet (onboarding).

      parameters:
        - $ref: "#/components/parameters/IdToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAccountProfileCommand"
      responses:
        "200":
          description: Account profile created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountProfileResponse"
        "401":
          description: >
            Missing/invalid access token, or missing/invalid `X-ID-Token` (`INVALID_ID_TOKEN`)

          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms:
    post:
      tags:
        - Classroom
      operationId: createClassroom
      summary: Create a classroom
      description: Creates a new classroom and returns it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassroomCommand"
      responses:
        "201":
          description: Classroom created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomResponse"
        "400":
          description: Invalid create command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms/query:
    post:
      tags:
        - Classroom
      operationId: getAllClassrooms
      summary: Get All Classrooms
      description: Get all classrooms in the database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomFilter"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllClassroomsResponse"
  /admin/classrooms/{id}:
    get:
      tags:
        - Classroom
      operationId: getClassroomById
      summary: Get a classroom by id
      description: Returns a single classroom by its identifier.
      parameters:
        - $ref: "#/components/parameters/ClassroomId"
      responses:
        "200":
          description: Classroom found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomResponse"
        "404":
          description: Classroom not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
        - Classroom
      operationId: updateClassroom
      summary: Update a classroom
      description: Updates an existing classroom and returns the updated resource.
      parameters:
        - $ref: "#/components/parameters/ClassroomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateClassroomCommand"
      responses:
        "200":
          description: Classroom updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomResponse"
        "400":
          description: Invalid update command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Classroom not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms/{classroomId}/members:
    post:
      tags:
        - ClassroomMembers
      operationId: createClassroomMembers
      summary: Add members to a classroom
      description: >
        Creates classroom memberships, reactivates previously removed members, or updates the
        role of already active members. Up to 30 members may be submitted in one request.
        Account profiles and existing memberships are loaded in batch.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassroomMembersCommand"
      responses:
        "201":
          description: Classroom members created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllClassroomMembersResponse"
        "400":
          description: Invalid create command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Classroom not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms/{classroomId}/members/query:
    post:
      tags:
        - ClassroomMembers
      operationId: getAllClassroomMembers
      summary: Get all classroom members
      description: Query members belonging to a classroom.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomMemberFilter"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllClassroomMembersResponse"
        "404":
          description: Classroom not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms/{classroomId}/members/{memberId}:
    delete:
      tags:
        - ClassroomMembers
      operationId: removeClassroomMember
      summary: Remove a classroom member
      description: Soft-deletes a classroom member by marking their status as REMOVED.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
        - $ref: "#/components/parameters/MemberId"
      responses:
        "204":
          description: Classroom member removed
        "404":
          description: Classroom member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms/{classroomId}/members/{memberId}/attendances/query:
    post:
      tags:
        - ClassroomSessions
      operationId: getClassroomMemberAttendances
      summary: Get classroom session attendances for a member
      description: >
        Query a classroom member's session attendance history. Use `attendanceDate`
        filters (for example `gte` / `lte`) to limit the range, and `status` (for
        example `ATTENDED`) to see sessions the member joined. Pagination and
        sorting follow the same pattern as other query endpoints.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
        - $ref: "#/components/parameters/MemberId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomSessionAttendanceFilter"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllClassroomSessionAttendancesResponse"
        "404":
          description: Classroom or classroom member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms/{classroomId}/sessions:
    post:
      tags:
        - ClassroomSessions
      operationId: createClassroomSession
      summary: Create a classroom session
      description: Creates a new session for a classroom.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassroomSessionCommand"
      responses:
        "201":
          description: Classroom session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomSessionResponse"
        "400":
          description: Invalid create command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Classroom not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms/{classroomId}/sessions/query:
    post:
      tags:
        - ClassroomSessions
      operationId: getAllClassroomSessions
      summary: Get all classroom sessions
      description: Query sessions belonging to a classroom.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassroomSessionFilter"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllClassroomSessionsResponse"
        "404":
          description: Classroom not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms/{classroomId}/sessions/{sessionId}:
    get:
      tags:
        - ClassroomSessions
      operationId: getClassroomSessionById
      summary: Get a classroom session by id
      description: Returns a single classroom session by its identifier.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Classroom session found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomSessionResponse"
        "404":
          description: Classroom session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
        - ClassroomSessions
      operationId: deleteClassroomSession
      summary: Delete a classroom session
      description: Hard-deletes a classroom session and its attendances.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "204":
          description: Classroom session deleted
        "404":
          description: Classroom session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms/{classroomId}/sessions/{sessionId}/attendances:
    post:
      tags:
        - ClassroomSessions
      operationId: createClassroomSessionAttendance
      summary: Create a classroom session attendance
      description: Records attendance for a classroom member in a session.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassroomSessionAttendanceCommand"
      responses:
        "201":
          description: Classroom session attendance created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomSessionAttendanceResponse"
        "400":
          description: Invalid create command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Classroom, session, or member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Attendance already exists for the member in this session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms/{classroomId}/sessions/{sessionId}/attendances/{attendanceId}:
    delete:
      tags:
        - ClassroomSessions
      operationId: deleteClassroomSessionAttendance
      summary: Delete a classroom session attendance
      description: Hard-deletes a classroom session attendance record.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/AttendanceId"
      responses:
        "204":
          description: Classroom session attendance deleted
        "404":
          description: Classroom session attendance not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /private/storage:
    post:
      tags:
        - Storage
      operationId: uploadToStorage
      summary: Upload a file to the landing zone storage bucket
      description: Get a presigned URL to upload a file to the landing zone bucket. Form must be submitted to be moved to public (permanent) bucket
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadToStorageCommand"
      responses:
        "200":
          description: URL Created. Use the URL to upload file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadToStorageResponse"
  /test/storage/confirm-public:
    post:
      tags:
        - _Test
      operationId: confirmPublicFileUpload
      summary: Confirm a public file upload (local only)
      description: >
        Moves an object from the landing zone to the public store after upload. Local profile only — this endpoint is registered only when the Spring profile `local` is active.

      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - objectKey
              properties:
                objectKey:
                  type: string
                  minLength: 1
                  description: Object key in the landing zone (must start with `public/`)
                  example: public/540ba3e4-8026-45e9-9834-54aa0eb1a17a
      responses:
        "204":
          description: Public upload confirmed
        "400":
          description: Invalid public object key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Object not found in landing zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /test/storage/confirm-private:
    post:
      tags:
        - _Test
      operationId: confirmPrivateFileUpload
      summary: Confirm a private file upload (local only)
      description: >
        Moves an object from the landing zone to the permanent store and records a storage grant for the owner. Local profile only — this endpoint is registered only when the Spring profile `local` is active.

      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - objectKey
                - accountProfileId
              properties:
                objectKey:
                  type: string
                  minLength: 1
                  description: Object key in the landing zone (must start with `private/`)
                  example: private/540ba3e4-8026-45e9-9834-54aa0eb1a17a
                accountProfileId:
                  type: string
                  format: uuid
                  description: Owner account profile id for the storage grant
                  example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
      responses:
        "200":
          description: Private upload confirmed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - id
                  - ownerId
                  - objectKey
                  - objectBucket
                  - createdDate
                  - lastModifiedDate
                properties:
                  id:
                    type: integer
                    format: int64
                    description: Storage grant identifier
                    example: 1
                  ownerId:
                    type: string
                    format: uuid
                    description: Owner account profile id
                    example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  objectKey:
                    type: string
                    description: Object key in the destination bucket
                    example: private/540ba3e4-8026-45e9-9834-54aa0eb1a17a
                  objectBucket:
                    type: string
                    description: Destination bucket name
                    example: lms-local-public
                  createdDate:
                    type: string
                    format: date-time
                    description: When the grant was created
                  lastModifiedDate:
                    type: string
                    format: date-time
                    description: When the grant was last modified
        "400":
          description: Invalid private object key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Object not found in landing zone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms/{classroomId}/schedule:
    get:
      tags:
        - ClassroomSchedule
      operationId: getAllClassroomSchedules
      summary: Get all classroom schedules
      description: Returns all non-deleted schedules for a classroom.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllClassroomSchedulesResponse"
        "404":
          description: Classroom not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - ClassroomSchedule
      operationId: createClassroomSchedule
      summary: Create a classroom schedule
      description: Creates a new schedule for a classroom and returns it.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClassroomScheduleCommand"
      responses:
        "201":
          description: Classroom schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassroomScheduleResponse"
        "400":
          description: Invalid create command
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Classroom not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/classrooms/{classroomId}/schedule/{scheduleId}:
    delete:
      tags:
        - ClassroomSchedule
      operationId: deleteClassroomSchedule
      summary: Delete a classroom schedule
      description: Soft-deletes a classroom schedule by setting its deleted date for audit purposes.
      parameters:
        - $ref: "#/components/parameters/ClassroomIdPath"
        - $ref: "#/components/parameters/ScheduleId"
      responses:
        "204":
          description: Classroom schedule deleted
        "404":
          description: Classroom schedule not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    cognitoOAuth:
      type: oauth2
      description: >
        Cognito Hosted UI (authorization code + PKCE). Click Authorize in Swagger UI to open the Cognito login page. OAuth URLs are injected at runtime from COGNITO_DOMAIN (or COGNITO_AUTHORIZATION_URI / COGNITO_TOKEN_URI) — see application.yml under app.cognito. Client id comes from COGNITO_APP_CLIENT_ID. Cognito must allowlist http://localhost:8080/swagger-ui/oauth2-redirect.html (or your API origin) as a callback URL.

      flows:
        authorizationCode:
          # Replaced at serve time by OpenApiSpecController from app.cognito settings.
          authorizationUrl: __COGNITO_DOMAIN__/oauth2/authorize
          tokenUrl: __COGNITO_DOMAIN__/oauth2/token
          scopes:
            openid: OpenID Connect
            email: Email address
            profile: User profile
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Paste a Cognito JWT access token manually (alternative to Hosted UI login). Admin endpoints require the ADMIN Cognito group.

  parameters:
    ClassroomId:
      name: id
      in: path
      required: true
      description: Classroom identifier
      schema:
        type: string
        format: uuid
        description: Classroom UUID
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    ClassroomIdPath:
      name: classroomId
      in: path
      required: true
      description: Classroom identifier
      schema:
        type: string
        format: uuid
        description: Classroom UUID
        example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
    MemberId:
      name: memberId
      in: path
      required: true
      description: Classroom member identifier
      schema:
        type: string
        format: uuid
        description: Classroom member UUID
        example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Classroom session identifier
      schema:
        type: string
        format: uuid
        description: Classroom session UUID
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d
    AttendanceId:
      name: attendanceId
      in: path
      required: true
      description: Classroom session attendance identifier
      schema:
        type: string
        format: uuid
        description: Classroom session attendance UUID
        example: 1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
    ScheduleId:
      name: scheduleId
      in: path
      required: true
      description: Classroom schedule identifier
      schema:
        type: string
        format: uuid
        description: Classroom schedule UUID
        example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    IdToken:
      name: X-ID-Token
      in: header
      required: true
      description: Authentication Provider ID Token
      schema:
        type: string
        description: ID Token JWT
  schemas:
    UploadToStorageCommand:
      description: A command to generate presigned URLs to upload an item to storage
      properties:
        isPublic:
          type: boolean
          default: false
          description: Set to true if this is a public resource to be stored in the public bucket
          example: false
    UploadToStorageResponse:
      description: Response containing the presigned URL for uploading files
      required:
        - uploadUrl
        - objectKey
      properties:
        uploadUrl:
          type: string
          example: http://localhost:8080/upload
          description: Presigned URL to upload the file
        downloadUrl:
          type: string
          example: http://localhost:8080/download
          description: Presigned URL to download the file
        objectKey:
          type: string
          example: 540ba3e4-8026-45e9-9834-54aa0eb1a17a
          description: The key of the object saved in S3
    ClassroomFilter:
      type: object
      description: Student filter
      additionalProperties: false
      properties:
        page:
          type: integer
          default: 0
          minimum: 0
        size:
          type: integer
          default: 10
          minimum: 1
          maximum: 50
        sortBy:
          type: string
          pattern: '^(name|createdDate|lastModifiedDate)$'
        sortDirection:
          type: string
          enum: [ASC, DESC]
          default: ASC
        filters:
          type: array
          items:
            type: object
            required: [field, operator, value]
            properties:
              field:
                type: string
                pattern: '^(name)$'
              operator:
                type: string
                pattern: '^(eq|like|gt|lt|gte|lte)$'
              value:
                type: string
    ClassroomResponse:
      type: object
      description: Classroom resource returned by the API
      additionalProperties: false
      required:
        - id
        - name
        - numberOfMembers
        - createdDate
        - lastModifiedDate
      properties:
        id:
          type: string
          format: uuid
          description: Unique classroom identifier
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        name:
          type: string
          description: Display name of the classroom
          minLength: 1
          maxLength: 255
          example: Algebra I
        bannerKey:
          type: string
          description: Key to the stored classroom banner image in the Public S3 Bucket
          minLength: 1
          maxLength: 64
          example: public/3e4ef8d1-9581-402f-9e27-fec209aeb2d8
